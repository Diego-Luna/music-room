name: Deploy Production

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-main-${{ github.ref }}
  cancel-in-progress: true

env:
  BACKEND_API_URL: ${{ secrets.BACKEND_API_URL != '' && secrets.BACKEND_API_URL || vars.BACKEND_API_URL }}

jobs:
  build:
    name: Build Web Artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        working-directory: frontend/music_room_app
        run: flutter pub get

      - name: Build web
        working-directory: frontend/music_room_app
        run: flutter build web --release --base-href=/ --dart-define=BACKEND_API_URL=${{ env.BACKEND_API_URL }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/music_room_app/build/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        working-directory: frontend/music_room_app
        run: flutter pub get

      - name: Build APK
        working-directory: frontend/music_room_app
        run: flutter build apk --release --dart-define=BACKEND_API_URL=${{ env.BACKEND_API_URL }}

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: frontend/music_room_app/build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build iOS IPA (Unsigned)
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest-stable"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        working-directory: frontend/music_room_app
        run: flutter pub get

      - name: Build iOS (No Codesign)
        working-directory: frontend/music_room_app
        run: flutter build ios --release --no-codesign --dart-define=BACKEND_API_URL=${{env.BACKEND_API_URL}}

      - name: Compress iOS build
        working-directory: frontend/music_room_app/build/ios
        run: zip -r iphoneos.zip iphoneos

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-ios
          path: frontend/music_room_app/build/ios/iphoneos.zip

  release:
    name: Create GitHub Release
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v8
        with:
          name: app-release-apk
          path: build/android

      - name: Download iOS Artifact
        uses: actions/download-artifact@v8
        with:
          name: app-release-ios
          path: build/ios

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0.0-build-${{ github.run_number }}
          name: "Music Room Mobile Build v1.0.0-build-${{ github.run_number }}"
          body: |
            Automated production build from commit: ${{ github.sha }}
            
            Downloads:
            - **Android APK**: Download `app-release.apk` below.
            - **iOS Package (Unsigned)**: Download `iphoneos.zip` below.
          draft: false
          prerelease: true
          files: |
            build/android/app-release.apk
            build/ios/iphoneos.zip
