name: Deploy Production

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Web Artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        working-directory: frontend/music_room_app
        run: flutter pub get

      - name: Build web
        working-directory: frontend/music_room_app
        run: flutter build web --release --base-href=/music-room/ --dart-define=BACKEND_API_URL=${{ vars.BACKEND_API_URL }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/music_room_app/build/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        working-directory: frontend/music_room_app
        run: flutter pub get

      - name: Build APK
        working-directory: frontend/music_room_app
        run: flutter build apk --release --dart-define=BACKEND_API_URL=${{ vars.BACKEND_API_URL }}

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: frontend/music_room_app/build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build iOS IPA (Unsigned)
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        working-directory: frontend/music_room_app
        run: flutter pub get

      - name: Build iOS (No Codesign)
        working-directory: frontend/music_room_app
        run: flutter build ios --release --no-codesign --dart-define=BACKEND_API_URL=${{ vars.BACKEND_API_URL }}

      - name: Compress iOS build
        working-directory: frontend/music_room_app/build/ios
        run: zip -r iphoneos.zip iphoneos

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-ios
          path: frontend/music_room_app/build/ios/iphoneos.zip
