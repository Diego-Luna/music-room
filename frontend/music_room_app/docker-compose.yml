services:
  # Service to build Flutter Web and Android APK
  flutter-linux:
    image: instrumentisto/flutter:3.41
    platform: linux/amd64
    volumes:
      - .:/app
      - ../build:/app/build
      - /app/.dart_tool/
      - pub-cache:/root/.pub-cache
      - gradle-cache:/root/.gradle
      - android-sdk:/opt/android-sdk-linux
    working_dir: /app
    shm_size: '2gb'


  # ! Work in progress
  # --- START OF macOS-BUILDER SERVICE DEFINITION ---
  macos-builder:
    image: dockurr/macos
    container_name: macos-builder
    environment:
      VERSION: "15"
      DISK_SIZE: "100G"
      KVM: "N"
    devices:
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - 8006:8006
      - 5900:5900/tcp
      - 5900:5900/udp
    volumes:
      - .:/storage
    restart: always

  # Lightweight Nginx server to host the local web build
  web-server:
    image: nginx:alpine
    ports:
      - 5173:80
    volumes:
      - ../build/web:/usr/share/nginx/html

volumes:
  pub-cache:
  gradle-cache:
  android-sdk:
